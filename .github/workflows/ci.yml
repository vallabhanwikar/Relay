name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: "-B -ntp"

jobs:

  # Gate 1 - module boundaries. Pure static analysis, no context, no containers, so it fails
  # in seconds when someone reaches across a boundary. Section 11 names this as the mitigation
  # for scope creep, which is only true if it runs first and blocks everything behind it.
  architecture:
    name: Module boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Verify module structure
        run: mvn $MAVEN_ARGS -pl relay-app -am test -Dtest='ModularityTests,ArchitectureRulesTest' -DfailIfNoTests=false

      - name: Upload generated architecture diagrams
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modulith-docs
          path: relay-app/target/spring-modulith-docs/
          if-no-files-found: ignore

  build:
    name: Build and test
    runs-on: ubuntu-latest
    needs: architecture
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn $MAVEN_ARGS clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore

  # Gate 2 - RelayBench. The measuring stick was built before the features it measures, so this
  # job exists from Phase 0 and reports a failing scoreboard until the detector is real. A red
  # bench in week 3 is the plan working, not the plan failing.
  bench:
    name: RelayBench scoreboard
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # TODO(ticket 4): runner CLI + scoreboard JSON. Until then this job is a placeholder that
      # makes the missing harness visible in every CI run.
      - name: Run benchmark
        run: |
          echo "RelayBench runner not yet implemented - ticket 4."
          echo "Definition of done for Phase 0: bench runner executes 10 cases and reports a"
          echo "(failing) scoreboard."
          exit 0
